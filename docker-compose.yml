services:
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: transactions_db
      MYSQL_USER: will
      MYSQL_PASSWORD: jose123
      MYSQL_ROOT_PASSWORD: joseroot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: